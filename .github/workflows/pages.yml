name: Test and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Game logic tests (physics, bots, weapons, modes, netcode, lobby)
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (matches, map maker, online play between browsers)
        run: npm run test:browser
      - name: Keep screenshots from the browser test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/

  publish:
    # The default branch goes live. claude/bold-euler-fpbmyp is also allowed because
    # it's the only branch the github-pages environment accepts until `main` is added
    # under Settings -> Environments -> github-pages -> Deployment branches and tags.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_name == github.event.repository.default_branch || github.ref_name == 'claude/bold-euler-fpbmyp')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Give every module (in any folder), the page's script and the stylesheet a
      # per-release address, so a browser holding cached files from the last release
      # never mixes old and new code (tools/stamp.mjs; tests/stamp.test.mjs checks it).
      - name: Stamp file addresses with this release
        run: node tools/stamp.mjs "${GITHUB_SHA::8}" web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
