name: Test and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Game logic tests (physics, bots on every map, weapons)
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser test (loads the page and plays two matches)
        run: npm run test:browser
      - name: Keep screenshots from the browser test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/

  publish:
    # The default branch goes live. claude/bold-euler-fpbmyp is also allowed because
    # it's the only branch the github-pages environment accepts until `main` is added
    # under Settings -> Environments -> github-pages -> Deployment branches and tags.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_name == github.event.repository.default_branch || github.ref_name == 'claude/bold-euler-fpbmyp')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Give every script and the stylesheet a per-release address, so a browser
      # holding cached files from the last release never mixes old and new code.
      - name: Stamp file addresses with this release
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(from '\./[a-z]+\.js)'#\1?v=$v'#g" web/src/*.js
          sed -i -E "s#src=\"src/main\.js\"#src=\"src/main.js?v=$v\"#; s#href=\"style\.css\"#href=\"style.css?v=$v\"#" web/index.html
          grep -c "?v=$v" web/index.html web/src/main.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
