name: Test and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Game logic tests (physics, bots on every map, weapons)
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser test (loads the page and plays two matches)
        run: npm run test:browser
      - name: Keep screenshots from the browser test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/

  publish:
    # Only the repo's default branch goes live (GitHub Pages only accepts deploys from it).
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
